// War — Snapser Hermes WebSocket transport envelope.
//
// HASH DOMAIN NOTE: game state and player actions are NEVER modelled as proto
// messages. They travel as CANONICAL-JSON STRINGS inside string fields of the
// war.validator.v1 messages (see validator_messages.proto). This envelope only
// carries those request/response bytes as an opaque payload — the canonical
// JSON, and therefore the determinism hash, is identical on both client and
// validator. Re-modelling state/actions as proto fields would silently break
// the byte-for-byte parity contract.
//
// Bindings are generated by tools/gen-protos.sh — do not hand-edit generated code.
//
// This mirrors the Snapser Hermes pattern: a single ClientMessage/ServerMessage
// duplex over one WebSocket, multiplexing many request types via a oneof. The
// `snap-api-proxy` message type wraps a target method name + payload bytes that
// the gateway proxies to a backend snap RPC (here: ValidatorService).

syntax = "proto3";

package hermes;

option go_package = "thegoldenmule/war/validator/gen/hermes;hermes";

// SnapApiProxyRequest — the client->server "snap-api-proxy" body.
// `method` selects the ValidatorService RPC ("InitMatch" | "ValidateAction" |
// "CompleteMatch"); `payload` is the serialized request message bytes for that
// RPC (which themselves carry canonical-JSON strings). `request_id` correlates
// the async response.
message SnapApiProxyRequest {
  string request_id = 1;
  // Logical RPC target, e.g. "war.validator.v1.ValidatorService/ValidateAction"
  // or the short method name "ValidateAction". Named `api_method` (not `method`)
  // because godobuf would otherwise generate has_method(), colliding with the
  // built-in Object.has_method(). Field names are not on the wire, so this is safe.
  string api_method = 2;
  // Serialized request proto bytes for the selected method.
  bytes payload = 3;
}

// SnapApiProxyResponse — the server->client "snap-api-proxy" body.
// Echoes `request_id`; `payload` is the serialized response proto bytes.
message SnapApiProxyResponse {
  string request_id = 1;
  // gRPC-style status code (0 == OK).
  int32 status_code = 2;
  // Human-readable error detail when status_code != 0.
  string status_message = 3;
  // Serialized response proto bytes for the originating method.
  bytes payload = 4;
}

// ClientMessage — every frame the client sends over the Hermes WebSocket.
// `type` names the message kind ("snap-api-proxy" for validator RPCs). The
// oneof keeps the envelope extensible for future Hermes message types.
message ClientMessage {
  string type = 1;
  oneof body {
    SnapApiProxyRequest api_proxy = 2;
  }
}

// ServerMessage — every frame the validator sends back.
message ServerMessage {
  string type = 1;
  oneof body {
    SnapApiProxyResponse api_proxy = 2;
  }
}
