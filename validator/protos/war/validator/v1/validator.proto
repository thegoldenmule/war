// War — authoritative ValidatorService definition.
//
// HASH DOMAIN NOTE: game state and player actions are NEVER modelled as proto
// fields. They travel as CANONICAL-JSON STRINGS inside the request/response
// messages (see validator_messages.proto) so the determinism hash is computed
// over byte-identical JSON on both the GDScript client and the TypeScript
// validator. The TS engine under src/logic mirrors game/logic byte-for-byte.
// Do NOT re-model state/actions as proto messages — that forks the hash domain.
//
// Bindings are generated by tools/gen-protos.sh — do not hand-edit generated code.

syntax = "proto3";

package war.validator.v1;

import "war/validator/v1/validator_messages.proto";

option go_package = "thegoldenmule/war/validator/gen/war/validator/v1;validatorv1";

// ValidatorService — the authoritative rules referee for a War match.
//
// Optimistic + reconcile flow: the client applies each action locally for
// instant feedback and sends the predicted resulting hash. A matching hash
// ACKs the fast path; a mismatch returns the authoritative state to snap to.
// Reached over gRPC (:8081) directly, or via the Hermes WebSocket envelope
// (snap-api-proxy message type) which proxies these same RPCs.
service ValidatorService {
  // Open a match: deal the deterministic deck from the seed and return the
  // authoritative initial state + hash.
  rpc InitMatch(InitMatchRequest) returns (InitMatchResponse);

  // Validate a single client action against the authoritative engine. ACKs a
  // matching predicted hash, or returns the authoritative state on mismatch.
  rpc ValidateAction(ValidateActionRequest) returns (ValidateActionResponse);

  // Finalize a match once a terminal phase (player_win / cpu_win) is reached.
  rpc CompleteMatch(CompleteMatchRequest) returns (CompleteMatchResponse);
}
