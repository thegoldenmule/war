// War — ValidatorService request/response message types.
//
// HASH DOMAIN NOTE: game state and player actions are NEVER modelled as proto
// fields. They travel as CANONICAL-JSON STRINGS (the *_json fields below) so
// that the determinism hash is computed over byte-identical JSON on both the
// GDScript client and the TypeScript validator. Do NOT add structured proto
// representations of state/cards/actions — that would fork the hash domain and
// break the byte-for-byte parity contract.
//
//   canonical JSON  = json-stable-stringify(value, {space: 2})
//                     (keys sorted at every depth, 2-space indent, null-valued
//                      keys omitted, integers without a decimal point)
//   state hash      = hash_value(state) (8-lane rolling hash, 64 lowercase hex)
//
// Bindings are generated by tools/gen-protos.sh — do not hand-edit generated code.

syntax = "proto3";

package war.validator.v1;

option go_package = "thegoldenmule/war/validator/gen/war/validator/v1;validatorv1";

// ---------------------------------------------------------------------------
// InitMatch — open a new match. The validator deals the deterministic deck
// from `seed` and returns the authoritative initial state + its hash.
// ---------------------------------------------------------------------------
message InitMatchRequest {
  // Caller-chosen match identifier (idempotency key for the match record).
  string match_id = 1;
  // Authenticated player id (bound to the gateway-stamped User-Id).
  string player_id = 2;
  // Deterministic shuffle/match seed. Stored in state.seed.
  string seed = 3;
  // OPTIONAL: client-predicted initial state as canonical JSON. When present
  // the validator may fast-path the ACK if its hash matches predicted_hash.
  string predicted_state_json = 4;
  // OPTIONAL: client-predicted initial state hash (64 hex chars).
  string predicted_hash = 5;
}

message InitMatchResponse {
  // True when the match was created (or already existed idempotently).
  bool ok = 1;
  // Authoritative initial game state as canonical JSON. Empty when ok == false.
  string authoritative_state_json = 2;
  // Hash of authoritative_state_json (64 lowercase hex chars).
  string hash = 3;
  // Non-empty error code/message when ok == false.
  string error = 4;
}

// ---------------------------------------------------------------------------
// ValidateAction — the core optimistic+reconcile RPC. The client applies an
// action locally, then sends the prior state, the action, and its predicted
// resulting hash. A matching hash ACKs the fast path; a mismatch returns the
// authoritative state for the client to snap to.
// ---------------------------------------------------------------------------
message ValidateActionRequest {
  string match_id = 1;
  string player_id = 2;
  // The state the action was applied TO, as canonical JSON (the hash domain).
  string state_json = 3;
  // The action, as canonical JSON: { "type": string, ...args }.
  string action_json = 4;
  // Client-predicted hash of the resulting state (64 lowercase hex chars).
  string predicted_hash = 5;
}

message ValidateActionResponse {
  // True when the action was legal and applied by the authoritative engine.
  bool ok = 1;
  // True when predicted_hash matched the authoritative result hash. When true,
  // authoritative_state_json MAY be omitted (the client keeps its optimistic
  // state). When false, the client MUST snap to authoritative_state_json.
  bool ack = 2;
  // Authoritative resulting state as canonical JSON. Present on mismatch, and
  // always present on the terminal (win) transitions for audit.
  string authoritative_state_json = 3;
  // Hash of authoritative_state_json (64 lowercase hex chars).
  string hash = 4;
  // Engine events emitted by the transition, as a canonical-JSON array string
  // (e.g. flips, war escalations, special-card resolutions). Informational; not
  // part of the hashed state.
  string events_json = 5;
  // Non-empty error code/message when ok == false (illegal/rejected action).
  string error = 6;
}

// ---------------------------------------------------------------------------
// CompleteMatch — finalize a match (terminal phase reached or client resign).
// The validator records the outcome against the final authoritative state.
// ---------------------------------------------------------------------------
message CompleteMatchRequest {
  string match_id = 1;
  string player_id = 2;
  // Final state the client believes the match ended in, as canonical JSON.
  string final_state_json = 3;
  // Client-asserted final state hash (64 lowercase hex chars).
  string final_hash = 4;
}

message CompleteMatchResponse {
  // True when the validator accepted and recorded the completion.
  bool ok = 1;
  // Authoritative final game state as canonical JSON (for audit/reconcile).
  string authoritative_state_json = 2;
  // Hash of authoritative_state_json (64 lowercase hex chars).
  string hash = 3;
  // Resolved terminal phase: "player_win" | "cpu_win". Empty when ok == false.
  string outcome = 4;
  // Non-empty error code/message when ok == false.
  string error = 5;
}
